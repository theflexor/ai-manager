          description: Salt
        isEmailVerified:
          type: boolean
          example: true
          description: Email verified
        profilePicture:
          type: string
          example: https://pic.url
          description: Avatar URL
        fullName:
          type: string
          example: John Doe
          description: Name
        bio:
          type: string
          example: Short bio
          description: Bio
        role:
          type: string
          example: user
          description: Role
        preferences:
          type: object
          example:
            theme: dark
          description: Prefs
        createdAt:
          format: date-time
          type: string
          example: '2024-06-03T12:34:56Z'
          description: Created at
        updatedAt:
          format: date-time
          type: string
          example: '2024-06-04T12:00:00Z'
          description: Updated at
        wallet:
          description: Wallet
          allOf:
            - $ref: '#/components/schemas/Wallet'
        subscriptions:
          description: Owner of subscriptions
