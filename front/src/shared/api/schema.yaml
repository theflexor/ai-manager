info:
  title: AI manager
  description: хуйня
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  schemas:
    SearchUserResponseDto:
      type: object
      properties:
        id:
          type: number
          example: 1
          description: User ID
        email:
          type: string
          example: user@example.com
          description: User Email
        isEmailVerified:
          type: boolean
          example: true
          description: Email Verified Status
        profilePicture:
          type: string
          example: https://example.com/profile.jpg
          description: Profile Picture URL
      required:
        - id
        - email
        - isEmailVerified
        - profilePicture
    GetUserDto:
      type: object
      properties:
        id:
          type: number
          example: 1
        email:
          type: string
          example: nurdanokenov@gmail.com
        isEmailVerified:
          type: boolean
          example: false
        profilePicture:
          type: string
          example: ''
        fullName:
          type: string
          example: nurdan okenov
        bio:
          type: string
          example: I'm a software engineer with a passion for AI and фывфыв
        role:
          type: string
          example: user
        preferences:
          type: object
          example: null
        createdAt:
          type: string
          example: '2025-05-27T10:27:59.742Z'
        updatedAt:
          type: string
          example: '2025-05-27T12:58:21.370Z'
      required:
        - id
        - email
        - isEmailVerified
        - profilePicture
        - fullName
        - bio
        - role
        - preferences
        - createdAt
        - updatedAt
    UpdateUserDto:
      type: object
      properties:
        fullName:
          type: string
          description: The full name of the user
          example: John Doe
        bio:
          type: string
          description: The bio of the user
          example: >-
            I'm a software engineer with a passion for AI and subscription
            management.
        profilePicture:
          type: string
          description: The profile picture URL of the user
          example: https://example.com/profile.jpg
      required:
        - fullName
        - bio
        - profilePicture
    DepositDto:
      type: object
      properties:
        amount:
          type: number
          example: 100
          description: Amount to deposit
      required:
        - amount
    Wallet:
      type: object
      properties:
        id:
          type: number
        balance:
          type: number
        updatedAt:
          format: date-time
          type: string
        createdAt:
          format: date-time
          type: string
      required:
        - id
        - balance
        - updatedAt
        - createdAt
    CreateSubscriptionDto:
      type: object
      properties:
        serviceName:
          type: string
          example: ChatGPT Plus
        price:
          type: number
          example: 20
        currency:
          type: string
          example: USD
          enum:
            - USD
            - EUR
            - RUB
            - UAH
            - KGS
        description:
          type: string
          example: Подписка на GPT-4
        startsAt:
          format: date-time
          type: string
          example: '2025-06-01T00:00:00Z'
        expiresAt:
          format: date-time
          type: string
          example: '2025-12-01T00:00:00Z'
        type:
          type: string
          example: personal
          enum:
            - personal
            - group
            - trial
      required:
        - serviceName
        - price
        - currency
        - startsAt
        - expiresAt
        - type
    SubscriptionMember:
      type: object
      properties:
        id:
          type: number
          example: 1
          description: Unique identifier for the subscription member
        subscription:
          description: The subscription this member belongs to
          allOf:
            - $ref: '#/components/schemas/Subscription'
        user:
          description: The user who is a member of the subscription
          allOf:
            - $ref: '#/components/schemas/User'
        isOwner:
          type: boolean
          example: false
          description: Indicates if the user is the owner of the subscription
        addedAt:
          format: date-time
          type: string
          example: '2024-06-03T12:34:56.789Z'
          description: Date when the member was added
      required:
        - id
        - subscription
        - user
        - isOwner
        - addedAt
    ChatMessage:
      type: object
      properties: {}
    Group:
      type: object
      properties: {}
    Subscription:
      type: object
      properties:
        id:
          type: number
          example: 1
          description: Subscription ID
        userId:
          type: number
          example: 12
          description: ID of the user who owns the subscription
        user:
          description: The user who owns the subscription
          allOf:
            - $ref: '#/components/schemas/User'
        serviceName:
          type: string
          example: ChatGPT Plus
          description: Name of the subscribed service
        price:
          type: number
          example: 20
          description: Subscription price
        currency:
          type: string
          example: USD
          description: Currency of the subscription
          enum:
            - USD
            - EUR
            - RUB
            - UAH
            - KGS
          nullable: false
          default: USD
        description:
          type: string
          example: Access to GPT-4
          description: Description of the subscription
        expiresAt:
          format: date-time
          type: string
          example: '2025-12-01T00:00:00Z'
          description: Subscription expiration date
        startsAt:
          format: date-time
          type: string
          example: '2025-06-01T00:00:00Z'
          description: Subscription start date
        isActive:
          type: boolean
          example: true
          description: Is the subscription active
        type:
          type: string
          example: personal
          enum:
            - personal
            - group
            - trial
          description: Type of the subscription
        createdAt:
          format: date-time
          type: string
          example: '2025-05-01T12:00:00Z'
          description: Creation date
        updatedAt:
          format: date-time
          type: string
          example: '2025-05-10T12:00:00Z'
          description: Last update date
        members:
          description: Members of the subscription
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionMember'
        chatMessages:
          description: Chat messages related to the subscription
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        group:
          nullable: true
          description: Group associated with the subscription (if any)
          allOf:
            - $ref: '#/components/schemas/Group'
      required:
        - id
        - userId
        - user
        - serviceName
        - price
        - currency
        - expiresAt
        - startsAt
        - isActive
        - type
        - createdAt
        - updatedAt
        - members
        - chatMessages
        - group
    Transaction:
      type: object
      properties:
        id:
          type: number
          example: 1
          description: Уникальный идентификатор транзакции
        amount:
          type: number
          example: 199.99
          description: Сумма транзакции
          format: decimal
        type:
          type: string
          example: INCOME
          enum:
            - deposit
            - withdraw
          description: Тип транзакции
        description:
          type: string
          example: Оплата подписки
          description: Описание транзакции
        createdAt:
          format: date-time
          type: string
          example: '2024-05-28T12:34:56.789Z'
          description: Дата создания транзакции
        wallet:
          description: Кошелек, к которому относится транзакция
          allOf:
            - $ref: '#/components/schemas/Wallet'
        user:
          description: Пользователь, совершивший транзакцию
          allOf:
            - $ref: '#/components/schemas/User'
      required:
        - id
        - amount
        - type
        - createdAt
        - wallet
        - user
    User:
      type: object
      properties:
        id:
          type: number
          example: 1
          description: User ID
        email:
          type: string
          example: user@example.com
          description: Email
        passwordHash:
          type: string
